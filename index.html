<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My To-Do List</title>

  <!-- App styling -->
  <style>
    * {
      box-sizing: border-box;
    }

    /* Center the to-do app on the page */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f7f6;
      font-family: Arial, sans-serif;
      color: #222;
    }

    /* Card container for the to-do app */
    .todo-container {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 0;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      padding: 24px;
    }

    h2 {
      margin: 0 0 20px;
      text-align: center;
    }

    /* Input row with task field and add button */
    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 0;
      font-size: 16px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 0;
      font-weight: bold;
    }

    .add-btn {
      background: #2ecc71;
      color: white;
      padding: 12px 18px;
    }

    .add-btn:hover {
      background: #27ae60;
    }

    /* List styling for the task items */
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 0;
      padding: 12px 14px;
    }

    .task-text {
      flex: 1;
      word-break: break-word;
      font-size: 16px;
    }

    .remove-btn {
      background: #e74c3c;
      color: white;
      padding: 8px 12px;
      margin-left: 12px;
    }

    .remove-btn:hover {
      background: #c0392b;
    }
  </style>
</head>
<body>
  <!-- Main container for the to-do list -->
  <div class="todo-container">
    <h2>My To-Do List</h2>

    <div class="input-row">
      <input type="text" id="todo-input" placeholder="Type a task and press Enter" />
      <button class="add-btn" id="add-btn" type="button">Add</button>
    </div>

    <ul id="todo-list"></ul>
  </div>

  <script>
    // Get references to the main input, list, and add button elements.
    const todoInput = document.getElementById('todo-input');
    const todoList = document.getElementById('todo-list');
    const addBtn = document.getElementById('add-btn');

    // Add a new task to the list if the input contains text.
    function addTask() {
      const value = todoInput.value.trim();

      if (!value) {
        todoInput.focus();
        return;
      }

      const li = document.createElement('li');
      const taskText = document.createElement('span');
      taskText.className = 'task-text';
      taskText.textContent = value;

      const removeBtn = document.createElement('button');
      removeBtn.className = 'remove-btn';
      removeBtn.type = 'button';
      removeBtn.textContent = 'Remove';

      // Remove the task when the user clicks the delete button.
      removeBtn.addEventListener('click', () => {
        li.remove();
      });

      li.appendChild(taskText);
      li.appendChild(removeBtn);
      todoList.appendChild(li);

      // Clear the input and keep the cursor ready for the next task.
      todoInput.value = '';
      todoInput.focus();
    }

    // Add task when the user clicks the button.
    addBtn.addEventListener('click', addTask);

    // Allow Enter key to add a task as well.
    todoInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        addTask();
      }
    });
  </script>
</body>
</html>
