<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organizing Tips</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 72px 24px;
      background: #f2efe7;
      color: #292b25;
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: min(100%, 650px);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 34px;
      padding-bottom: 18px;
      border-bottom: 2px solid #71805b;
      color: #303b2b;
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: normal;
      line-height: 1.15;
    }

    .tips {
      max-width: 540px;
    }

    .tips p {
      margin: 0;
      padding: 16px 12px;
      border-bottom: 1px solid #d5d1c5;
      color: #41443b;
      font-size: 1.15rem;
      line-height: 1.5;
    }

    .tips p:nth-child(odd) {
      border-left: 3px solid #87916c;
      padding-left: 16px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Tips for staying organized</h1>
    <section class="tips">
      <P>Use this site!</P>
      <P>Stay on top of work</P>
      <P>Don't get distracted</P>
      <P>Use a calendar</P>
      <P>Wake up early</P>
      <P>Use this site!</P>
    </section>
  </main>
</body>
</html>
